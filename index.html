<body>

<div id="message"></div>

<div class="header">
  👋 Salom
</div>

<div class="brand">
  💎 OLOV PIN BOT
</div>

<div class="balance">
  <small>BALANS</small>
  <div class="money" id="balance">1 235 286 so‘m</div>

  <div class="buttons">
    <button class="green" onclick="topUp()">＋ To‘ldirish</button>
  </div>
</div>

<div class="buttons">
  <button onclick="orders()">🎟 Promokodlar</button>
  <button onclick="support()">🎧 Yordam</button>
</div>

<div style="
  margin:18px 15px;
  padding:35px 15px;
  border-radius:22px;
  background:linear-gradient(135deg,#25104d,#6428c9,#171d45);
  border:1px solid #49347a;
  text-align:center;
  font-size:23px;
  font-weight:bold;
">
  🎮 O‘YINLAR UCHUN<br>
  <span style="color:#b879ff;">MAXSUS TAKLIFLAR</span>
</div>

<div style="
  padding:0 15px 12px;
  font-size:22px;
  font-weight:bold;
">
  Ommabop o‘yinlar
</div>

<div class="games">

  <div class="game" onclick="game('PUBG Mobile')">
    <div class="game-icon">🎯</div>
    <div class="game-name">PUBG Mobile</div>
  </div>

  <div class="game" onclick="game('Free Fire')">
    <div class="game-icon">🔥</div>
    <div class="game-name">Free Fire</div>
  </div>

  <div class="game" onclick="game('Mobile Legends')">
    <div class="game-icon">⚔️</div>
    <div class="game-name">Mobile Legends</div>
  </div>

  <div class="game" onclick="game('Brawl Stars')">
    <div class="game-icon">⭐</div>
    <div class="game-name">Brawl Stars</div>
  </div>

  <div class="game" onclick="game('Standoff 2')">
    <div class="game-icon">🎮</div>
    <div class="game-name">Standoff 2</div>
  </div>

  <div class="game" onclick="game('Clash of Clans')">
    <div class="game-icon">🏰</div>
    <div class="game-name">Clash of Clans</div>
  </div>

</div>

<div class="bottom">

  <button class="selected" onclick="home()">
    🏠<br>Bosh sahifa
  </button>

  <button onclick="orders()">
    🎮<br>Buyurtma
  </button>

  <button onclick="topUp()">
    💳<br>To‘ldirish
  </button>

  <button onclick="orders()">
    🕐<br>Buyurtmalar
  </button>

  <button onclick="support()">
    👤<br>Profil
  </button>

</div>

<script>
function topUp() {
  const modal = document.getElementById("paymentModal");

  if (!modal) {
    alert("❌ To‘lov oynasi topilmadi.");
    return;
  }

  modal.style.display = "flex";
}

function closePaymentModal() {
  const modal = document.getElementById("paymentModal");

  if (modal) {
    modal.style.display = "none";
  }
}

function selectPayment(method) {
  const oldModal = document.getElementById("amountModal");
  if (oldModal) oldModal.remove();

  const modal = document.createElement("div");
  modal.id = "amountModal";

  modal.innerHTML = `
    <div style="
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.75);
      z-index:10000;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    ">
      <div style="
        width:100%;
        max-width:380px;
        background:#111827;
        border-radius:24px;
        padding:22px;
        color:white;
        box-sizing:border-box;
      ">

        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          margin-bottom:20px;
        ">
          <h2 style="margin:0;font-size:24px;">
            💳 ${method}
          </h2>

          <button onclick="document.getElementById('amountModal').remove()" style="
            border:0;
            background:#263244;
            color:white;
            width:40px;
            height:40px;
            border-radius:12px;
            font-size:20px;
          ">×</button>
        </div>

        <p style="
          color:#9ca3af;
          margin-bottom:10px;
          font-size:16px;
        ">
          Summani kiriting
        </p>

        <div style="
          background:#182235;
          border:1px solid #303b52;
          border-radius:18px;
          padding:16px;
          display:flex;
          align-items:center;
          margin-bottom:16px;
        ">
          <input
            id="amountInput"
            type="number"
            min="1000"
            placeholder="0"
            style="
              width:100%;
              border:0;
              outline:0;
              background:transparent;
              color:white;
              font-size:30px;
            "
          >
          <span style="
            color:#9ca3af;
            font-size:17px;
          ">so‘m</span>
        </div>

        <div style="
          display:grid;
          grid-template-columns:1fr 1fr;
          gap:10px;
          margin-bottom:20px;
        ">
          <button onclick="setAmount(50000)" style="
            padding:15px;
            border:0;
            border-radius:14px;
            background:#1d2939;
            color:white;
            font-size:16px;
            font-weight:bold;
          ">50k</button>

          <button onclick="setAmount(100000)" style="
            padding:15px;
            border:0;
            border-radius:14px;
            background:#1d2939;
            color:white;
            font-size:16px;
            font-weight:bold;
          ">100k</button>

          <button onclick="setAmount(200000)" style="
            padding:15px;
            border:0;
            border-radius:14px;
            background:#1d2939;
            color:white;
            font-size:16px;
            font-weight:bold;
          ">200k</button>

          <button onclick="setAmount(500000)" style="
            padding:15px;
            border:0;
            border-radius:14px;
            background:#1d2939;
            color:white;
            font-size:16px;
            font-weight:bold;
          ">500k</button>
        </div>

        <button onclick="continuePayment('${method}')" style="
          width:100%;
          padding:17px;
          border:0;
          border-radius:16px;
          background:#263b63;
          color:white;
          font-size:17px;
          font-weight:bold;
        ">
          Summani kiriting
        </button>

      </div>
    </div>
  `;

  document.body.appendChild(modal);
}

function setAmount(amount) {
  document.getElementById("amountInput").value = amount;
}

function continuePayment(method) {
  const amount = Number(document.getElementById("amountInput").value);

  if (!amount || amount < 1000) {
    alert("❌ Summani to‘g‘ri kiriting.");
    return;
  }

  alert(
    "✅ " + method +
    " tanlandi.\n\n💰 Summa: " +
    amount.toLocaleString("uz-UZ") +
    " so‘m"
  );
}
function orders() {
  const orders = JSON.parse(localStorage.getItem("orders") || "[]");
  if (orders.length === 0) {
    alert("📋 Buyurtmalar\n\n❌ Hozircha buyurtmalar mavjud emas.");
    return;
  }

  let text = "📋 BUYURTMALAR\n\n";

  orders.forEach((order, index) => {
    text += `🛒 Buyurtma #${index + 1}\n`;
    text += `🎮 ${order.game || "Noma'lum"}\n`;
    text += `📌 Holati: ${order.status || "Tekshirilmoqda"}\n\n`;
  });

  alert(text);
}

function support() {
  alert("💬 YORDAM BO‘LIMI\n\n📞 Admin: @zefrix_admiral\n\n❓ Muammo bo‘lsa, admin bilan bog‘laning.");
}

function home() {
  window.scrollTo({top: 0, behavior: "smooth"});
}

function game(name) {
  
   if (name === "PUBG Mobile") {
    const packages = [
      { uc: 60, price: "11 700" },
      { uc: 325, price: "59 000" },
      { uc: 660, price: "115 000" },
      { uc: 1800, price: "290 000" },
      { uc: 3850, price: "575 000" },
      { uc: 8100, price: "1 165 000" }
    ];

    let box = document.createElement("div");

    box.style.position = "fixed";
    box.style.top = "0";
    box.style.left = "0";
    box.style.width = "100%";
    box.style.height = "100%";
    box.style.background = "#080b18";
    box.style.color = "white";
    box.style.zIndex = "9999";
    box.style.padding = "25px 15px";
    box.style.overflowY = "auto";

    box.innerHTML = `
      <button onclick="this.parentElement.remove()"
        style="padding:10px 18px;border-radius:14px;border:0;background:#18233b;color:white;font-size:16px;">
        ← Orqaga
      </button>

      <h1 style="margin:25px 0 8px;font-size:28px;">
        🎮 PUBG Mobile
      </h1>

      <p style="color:#9aa8b8;margin-bottom:25px;">
        🪙 UC Paketni tanlang
      </p>

      <div id="pubgPackages"
        style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;">
      </div>
    `;

    document.body.appendChild(box);

    const list = box.querySelector("#pubgPackages");

    packages.forEach((p) => {
      const card = document.createElement("button");

      card.style.background = "#111a26";
      card.style.border = "1px solid #29344d";
      card.style.borderRadius = "18px";
      card.style.padding = "20px 10px";
      card.style.color = "white";
      card.style.minHeight = "120px";
      card.style.cursor = "pointer";

      card.innerHTML = `
        <div style="font-size:30px;">🪙</div>
        <div style="font-size:20px;font-weight:bold;margin-top:8px;">
          ${p.uc} UC
        </div>
        <div style="font-size:15px;color:#aeb3c7;margin-top:7px;">
          ${p.price} so'm
        </div>
      `;

      card.onclick = function() {
        const playerId = prompt(
          "🎮 PUBG Mobile\n\n" +
          "🪙 " + p.uc + " UC\n" +
          "💰 " + p.price + " so'm\n\n" +
          "👤 Player ID raqamingizni kiriting:"
        );

        if (!playerId) {
          alert("❌ Player ID kiritilmadi.");
          return;
        }

        alert(
          "✅ Paket tanlandi!\n\n" +
          "🪙 " + p.uc + " UC\n" +
          "💰 " + p.price + " so'm\n" +
          "👤 ID: " + playerId
        );
      };

      list.appendChild(card);
    });

    return;
  }

  alert("🎮 " + name + " tanlandi.");
}
</script>
<div id="paymentModal" style="
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  z-index:10000;
  align-items:center;
  justify-content:center;
  padding:20px;
">
  <div style="
    width:100%;
    max-width:380px;
    background:#111827;
    border-radius:24px;
    padding:22px;
    color:white;
    box-sizing:border-box;
  ">

    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    ">
      <h2 style="margin:0;">💳 Hisob to‘ldirish</h2>

      <button onclick="closePaymentModal()" style="
        border:0;
        background:#263244;
        color:white;
        width:40px;
        height:40px;
        border-radius:12px;
        font-size:20px;
      ">✕</button>
    </div>

    <p style="color:#9ca3af;margin-bottom:18px;">
      To‘lov usulini tanlang
    </p>

    <div style="
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    ">

      <button onclick="selectPayment('HUMO')" style="
        padding:22px 10px;
        border:0;
        border-radius:18px;
        background:#1d2939;
        color:white;
        font-size:17px;
        font-weight:bold;
      ">
        💳<br>HUMO
      </button>

      <button onclick="selectPayment('UzCard')" style="
        padding:22px 10px;
        border:0;
        border-radius:18px;
        background:#1d2939;
        color:white;
        font-size:17px;
        font-weight:bold;
      ">
        💳<br>UzCard
      </button>

      <button onclick="selectPayment('VISA')" style="
        padding:22px 10px;
        border:0;
        border-radius:18px;
        background:#1d2939;
        color:white;
        font-size:17px;
        font-weight:bold;
      ">
        💳<br>VISA
      </button>

      <button onclick="selectPayment('Bankomat')" style="
        padding:22px 10px;
        border:0;
        border-radius:18px;
        background:#1d2939;
        color:white;
        font-size:17px;
        font-weight:bold;
      ">
        🏦<br>Bankomat
      </button>

    </div>
  </div>
</div>
</body>
