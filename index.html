<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLOV PIN</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#050b12;
  color:white;
  min-height:100vh;
  padding-bottom:85px;
}

.header{
  padding:20px;
  text-align:center;
  font-size:25px;
  font-weight:bold;
  border-bottom:1px solid #18222e;
}

.brand{
  padding:20px;
  text-align:center;
  font-size:23px;
  font-weight:bold;
  color:#72ff18;
}

.balance{
  margin:15px;
  padding:22px;
  border-radius:22px;
  background:linear-gradient(135deg,#111a26,#182b35);
  border:1px solid #263747;
  text-align:center;
}

.balance small{
  color:#9aa8b8;
  font-size:14px;
  letter-spacing:2px;
}

.money{
  margin:8px 0 20px;
  font-size:35px;
  font-weight:bold;
  color:#7cff19;
}

.buttons{
  display:flex;
  gap:10px;
}

button{
  border:0;
  border-radius:15px;
  padding:14px;
  color:white;
  background:#172231;
  font-size:14px;
  font-weight:bold;
  flex:1;
}

.green{
  background:#72ff18;
  color:#071006;
}

.tabs{
  display:flex;
  gap:10px;
  padding:10px 15px;
}

.tab{
  border:1px solid #23404a;
  border-radius:25px;
  padding:12px 20px;
  color:#9caabd;
  background:#0d151f;
}

.tab.active{
  color:#7cff19;
  border-color:#72ff18;
}

.search{
  margin:10px 15px 18px;
  padding:17px;
  border-radius:16px;
  background:#111a26;
  color:#78879a;
  border:1px solid #202c3b;
}

.games{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:0 15px 90px;
}

.game{
  background:#111a26;
  border:1px solid #253242;
  border-radius:16px;
  overflow:hidden;
  text-align:center;
}

.game-icon{
  height:115px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  background:linear-gradient(135deg,#172b38,#263c48);
}

.game-name{
  padding:13px 5px;
  font-weight:bold;
  font-size:14px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  background:#0c141e;
  border-top:1px solid #1d2937;
  padding:10px;
  z-index:10;
}

.bottom button{
  background:transparent;
  color:#8290a0;
}

.bottom .selected{
  color:#7cff19;
}

#message{
  position:fixed;
  top:20px;
  left:15px;
  right:15px;
  background:#172231;
  border:1px solid #72ff18;
  border-radius:15px;
  padding:15px;
  text-align:center;
  display:none;
  z-index:20;
}
</style>
</head>

<body>

<div id="message"></div>

<div class="header">
  🔥 OLOV PIN
</div>

<div class="brand">
  🇺🇿 UZ DONAT BOT 💎
</div>

<div class="balance">
  <small>BALANS</small>
  <div class="money" id="balance">0 so'm</div>

  <div class="buttons">
    <button class="green" onclick="topUp()">💳 Balans</button>
    <button onclick="orders()">🧾 Buyurtmalar</button>
    <button onclick="support()">💬 Yordam</button>
  </div>
</div>

<div class="tabs">
  <button class="tab active">🎮 O'yinlar</button>
  <button class="tab">⭐ Mashhur</button>
</div>

<div class="search">
  🔎 O'yinni tanlang
</div>

<div class="games">

  <div class="game" onclick="game('PUBG Mobile')">
    <div class="game-icon">🔫</div>
    <div class="game-name">PUBG Mobile</div>
  </div>

  <div class="game" onclick="game('Mobile Legends')">
    <div class="game-icon">⚔️</div>
    <div class="game-name">Mobile Legends</div>
  </div>

  <div class="game" onclick="game('Standoff 2')">
    <div class="game-icon">🎯</div>
    <div class="game-name">Standoff 2</div>
  </div>

  <div class="game" onclick="game('Free Fire')">
    <div class="game-icon">🔥</div>
    <div class="game-name">Free Fire</div>
  </div>

  <div class="game" onclick="game('Brawl Stars')">
    <div class="game-icon">⭐</div>
    <div class="game-name">Brawl Stars</div>
  </div>

  <div class="game" onclick="game('Clash of Clans')">
    <div class="game-icon">🏰</div>
    <div class="game-name">Clash of Clans</div>
  </div>

</div>

<div class="bottom">
  <button class="selected" onclick="home()">🏠<br>Bosh sahifa</button>
  <button onclick="orders()">🧾<br>Buyurtma</button>
  <button onclick="support()">💬<br>                       
    
  </button>
</div>

<script>
function topUp() {
 const summa = prompt("💳 Balansni to‘ldirish\n\nSummani kiriting (so‘m):");

if (summa && Number(summa) > 0) {
  const usul = prompt("To‘lov usulini tanlang:\n\n1 — Click\n2 — Payme");

  if (usul === "1") {
    alert("💳 Click tanlandi.\nSumma: " + summa + " so‘m\n\nClick to‘lovi keyingi bosqichda ulanadi.");
  } else if (usul === "2") {
    alert("💳 Payme tanlandi.\nSumma: " + summa + " so‘m\n\nPayme to‘lovi keyingi bosqichda ulanadi.");
  } else {
    alert("❌ To‘lov usuli tanlanmadi.");
  }
} else {
  alert("❌ To‘g‘ri summa kiriting.");
}


  function orders() {
  alert("📡 Buyurtma Holati\n\n⏳ Buyurtmangiz tekshirilmoqda...");
  }

function support() {
  alert("Yordam bo‘limi 💬");
}

function home() {
  window.scrollTo({top: 0, behavior: "smooth"});
}

function game(name) {
  alert(name + " tanlandi 🎮");
}
</script>

</body>
</html>
