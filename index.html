<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <title>OLOV PIN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b18;
      color: white;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .header {
      padding: 22px 20px 8px;
      font-size: 25px;
      font-weight: bold;
    }

    .brand {
      padding: 8px 20px 20px;
      color: #aeb3c7;
      font-size: 16px;
    }

    .balance {
      margin: 0 15px 18px;
      padding: 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, #11182a, #18233b);
      border: 1px solid #29344d;
    }

    .balance small {
      color: #727b96;
      font-size: 14px;
      font-weight: bold;
    }

    .money {
      margin: 8px 0 16px;
      font-size: 32px;
      font-weight: bold;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 15px;
      color: white;
      background: #182235;
      border: 1px solid #29344d;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .green {
      width: 100%;
      background: #7cff19;
      color: #071006;
    }

    .actions {
      display: flex;
      gap: 10px;
      padding: 0 15px;
      margin-bottom: 20px;
    }

    .actions button {
      flex: 1;
    }

    .title {
      padding: 0 15px 12px;
      font-size: 22px;
      font-weight: bold;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 15px;
    }

    .game {
      padding: 25px 10px;
      text-align: center;
      background: #11182a;
      border: 1px solid #29344d;
      border-radius: 18px;
    }

    .game-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .game-name {
      font-size: 14px;
      font-weight: bold;
    }

    .bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      gap: 5px;
      padding: 10px;
      background: #10172a;
      border-top: 1px solid #29344d;
      z-index: 100;
    }

    .bottom button {
      flex: 1;
      background: transparent;
      border: 0;
      padding: 8px 3px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="header">
    👋 Salom 🫡
  </div>

  <div class="brand">
    💎 OLOV PIN BOT
  </div>

  <div class="balance">
    <small>BALANS</small>

    <div class="money" id="balance">
      0 so‘m
    </div>

    <button class="green" onclick="topUp()">
      ＋ To‘ldirish
    </button>
  </div>

  <div class="actions">
    <button onclick="orders()">
      🎟 Promokodlar
    </button>

    <button onclick="support()">
      🎧 Yordam
    </button>
  </div>

  <div class="title">
    Ommabop o‘yinlar
  </div>

  <div class="games">

    <div class="game" onclick="game('PUBG Mobile')">
      <div class="game-icon">🎯</div>
      <div class="game-name">PUBG Mobile</div>
    </div>

    <div class="game" onclick="game('Free Fire')">
      <div class="game-icon">🔥</div>
      <div class="game-name">Free Fire</div>
    </div>

    <div class="game" onclick="game('Mobile Legends')">
      <div class="game-icon">⚔️</div>
      <div class="game-name">Mobile Legends</div>
    </div>

    <div class="game" onclick="game('Brawl Stars')">
      <div class="game-icon">⭐</div>
      <div class="game-name">Brawl Stars</div>
    </div>

    <div class="game" onclick="game('Standoff 2')">
      <div class="game-icon">🎮</div>
      <div class="game-name">Standoff 2</div>
    </div>

    <div class="game" onclick="game('Clash of Clans')">
      <div class="game-icon">🏰</div>
      <div class="game-name">Clash of Clans</div>
    </div>

  </div>

  <div class="bottom">

    <button onclick="home()">
      🏠<br>Bosh sahifa
    </button>

    <button onclick="orders()">
      🎮<br>Buyurtma
    </button>

    <button onclick="topUp()">
      💳<br>To‘ldirish
    </button>

    <button onclick="orders()">
      🕐<br>Buyurtmalar
    </button>

    <button onclick="profile()">
      👤<br>Profil
    </button>

  </div>


<script>

function home() {
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

  function topUp() {

  const oldModal = document.getElementById("paymentModal");
  if (oldModal) oldModal.remove();

  const modal = document.createElement("div");
  modal.id = "paymentModal";

  modal.innerHTML = `
    <div style="
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.75);
      z-index:10000;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    ">

      <div style="
        width:100%;
        max-width:420px;
        background:#11182a;
        border:1px solid #29344d;
        border-radius:24px;
        padding:22px;
      ">

        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          margin-bottom:20px;
        ">

          <div style="
            font-size:22px;
            font-weight:bold;
          ">
            💳 Hisob to‘ldirish
          </div>

          <button
            onclick="closePaymentModal()"
            style="
              width:40px;
              height:40px;
              padding:0;
              border-radius:12px;
              font-size:20px;
            "
          >
            ✕
          </button>

        </div>

        <div style="
          color:#9aa8b8;
          font-size:14px;
          margin-bottom:15px;
        ">
          💰 To‘lov usulini tanlang
        </div>

        <div style="
          display:flex;
          flex-direction:column;
          gap:12px;
        ">

          <button
            onclick="selectPayment('HUMO')"
            style="
              width:100%;
              padding:20px;
              text-align:left;
              font-size:16px;
              background:#182235;
              border:1px solid #29344d;
            "
          >
            💳 HUMO
            <span style="
              float:right;
              color:#7cff19;
            ">›</span>
          </button>

          <button
            onclick="selectPayment('UZCARD')"
            style="
              width:100%;
              padding:20px;
              text-align:left;
              font-size:16px;
              background:#182235;
              border:1px solid #29344d;
            "
          >
            💳 UZCARD
            <span style="
              float:right;
              color:#7cff19;
            ">›</span>
          </button>

          <button
            onclick="selectPayment('VISA')"
            style="
              width:100%;
              padding:20px;
              text-align:left;
              font-size:16px;
              background:#182235;
              border:1px solid #29344d;
            "
          >
            💳 VISA
            <span style="
              float:right;
              color:#7cff19;
            ">›</span>
          </button>

          <button
            onclick="selectPayment('BANKOMAT')"
            style="
              width:100%;
              padding:20px;
              text-align:left;
              font-size:16px;
              background:#182235;
              border:1px solid #29344d;
            "
          >
            🏦 BANKOMAT
            <span style="
              float:right;
              color:#7cff19;
            ">›</span>
          </button>

        </div>

      </div>

    </div>
  `;

  document.body.appendChild(modal);
}


function closePaymentModal() {
  const modal = document.getElementById("paymentModal");

  if (modal) {
    modal.remove();
  }
}


function continuePayment(method) {

  const input = document.getElementById("amountInput");
  const amount = input.value.trim();

  if (!amount) {
    alert("❌ Summani kiriting.");
    return;
  }

  const oldModal = document.getElementById("amountModal");

  if (oldModal) {
    oldModal.remove();
  }

  const modal = document.createElement("div");
  modal.id = "cardPaymentModal";

  modal.innerHTML = `
    <div style="
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.75);
      z-index:10000;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    ">

      <div style="
        width:100%;
        max-width:400px;
        background:#182235;
        border:1px solid #29344d;
        border-radius:18px;
        padding:25px;
        box-sizing:border-box;
        text-align:center;
      ">

        <div style="
          font-size:22px;
          font-weight:bold;
          margin-bottom:20px;
        ">
          💳 TO‘LOV
        </div>

        <div style="
          color:#9aa8b8;
          font-size:15px;
          margin-bottom:8px;
        ">
          ${method}
        </div>

        <div style="
          color:#9aa8b8;
          margin-bottom:18px;
        ">
          To‘lov summasi
        </div>

        <div style="
          font-size:25px;
          font-weight:bold;
          color:#7cff19;
          margin-bottom:25px;
        ">
          ${Number(amount).toLocaleString("uz-UZ")} so‘m
        </div>

        <div style="
          background:#101827;
          border:1px solid #29344d;
          border-radius:14px;
          padding:18px;
          margin-bottom:20px;
        ">

          <div style="
            color:#9aa8b8;
            font-size:14px;
            margin-bottom:8px;
          ">
            💳 Karta raqami
          </div>

          <div style="
            font-size:20px;
            font-weight:bold;
            letter-spacing:1px;
          ">
            8600 **** **** 1234
          </div>

        </div>

        <button
          onclick="copyMyCard()"
          style="
            width:100%;
            padding:15px;
            border:0;
            border-radius:12px;
            background:#7cff19;
            color:#101827;
            font-size:17px;
            font-weight:bold;
          "
        >
          📋 Karta raqamini nusxalash
        </button>

        <button
          onclick="document.getElementById('cardPaymentModal').remove()"
          style="
            width:100%;
            margin-top:10px;
            padding:13px;
            border:1px solid #29344d;
            border-radius:12px;
            background:transparent;
            color:#9aa8b8;
            font-size:16px;
          "
        >
          Bekor qilish
        </button>

      </div>
    </div>
  `;

  document.body.appendChild(modal);
}


function copyMyCard() {

  const cardNumber = "5614686816308491";

  navigator.clipboard.writeText(cardNumber).then(() => {
    alert("✅ Karta raqami nusxalandi!");
  }).catch(() => {
    alert("📋 Karta raqami: " + cardNumber);
  });

}

</script>

</body>
</html>
