  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b18;
      color: white;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .header {
      padding: 22px 20px 8px;
      font-size: 25px;
      font-weight: bold;
    }

    .brand {
      padding: 8px 20px 20px;
      color: #aeb3c7;
      font-size: 16px;
    }

    .balance {
      margin: 0 15px 18px;
      padding: 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, #11182a, #18233b);
      border: 1px solid #29344d;
    }

    .balance small {
      color: #727b96;
      font-size: 14px;
      font-weight: bold;
    }

    .money {
      margin: 8px 0 16px;
      font-size: 32px;
      font-weight: bold;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 15px;
      color: white;
      background: #182235;
      border: 1px solid #29344d;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .green {
      width: 100%;
      background: #7cff19;
      color: #071006;
    }

    .actions {
      display: flex;
      gap: 10px;
      padding: 0 15px;
      margin-bottom: 20px;
    }

    .actions button {
      flex: 1;
    }

    .title {
      padding: 0 15px 12px;
      font-size: 22px;
      font-weight: bold;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 15px;
    }

    .game {
      padding: 25px 10px;
      text-align: center;
      background: #11182a;
      border: 1px solid #29344d;
      border-radius: 18px;
    }

    .game-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .game-name {
      font-size: 14px;
      font-weight: bold;
    }

    .bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      gap: 5px;
      padding: 10px;
      background: #10172a;
      border-top: 1px solid #29344d;
      z-index: 100;
    }

    .bottom button {
      flex: 1;
      background: transparent;
      border: 0;
      padding: 8px 3px;
      font-size: 12px;
    }
  </style>
</head>

  function selectFreeFirePackage(name, price) {

  const id = prompt("🆔 Free Fire ID kiriting:");

  if (!/^\d+$/.test(id)) {
    alert("❌ ID faqat raqamlardan iborat bo‘lishi kerak!");

    "🆔 ID: " + id +
