  * {

}

body {

}

  font-size: 16px;

}

  background: linear-gradient(135deg, #11182a, #18233b);

}

.balance small {

}

  background: linear-gradient(135deg, #965cff, #7445e8);

  display: flex;
  gap: 10px;

  grid-template-columns: repeat(2, 1fr);

  border: 1px solid #29344d;

<body>

<div id="message"></div>

<div class="header">
  👋 Salom
</div>

<div class="brand">
  💎 OLOV PIN BOT
</div>

<div class="balance">
  <small>BALANS</small>
  <div class="money" id="balance">1 235 286 so‘m</div>

  <div class="buttons">
    <button class="green" onclick="topUp()">＋ To‘ldirish</button>
  </div>
</div>

<div class="buttons">
  <button onclick="orders()">🎟 Promokodlar</button>
  <button onclick="support()">🎧 Yordam</button>
</div>

<div style="
  margin:18px 15px;
  padding:35px 15px;
  border-radius:22px;
  background:linear-gradient(135deg,#25104d,#6428c9,#171d45);
  border:1px solid #49347a;
  text-align:center;
  font-size:23px;
  font-weight:bold;
">
  🎮 O‘YINLAR UCHUN<br>
  <span style="color:#b879ff;">MAXSUS TAKLIFLAR</span>
</div>

<div style="
  padding:0 15px 12px;
  font-size:22px;
  font-weight:bold;
">
  Ommabop o‘yinlar
</div>

<div class="games">

  <div class="game" onclick="game('PUBG Mobile')">
    <div class="game-icon">🎯</div>
    <div class="game-name">PUBG Mobile</div>
  </div>

  <div class="game" onclick="game('Free Fire')">
    <div class="game-icon">🔥</div>
    <div class="game-name">Free Fire</div>
  </div>

  <div class="game" onclick="game('Mobile Legends')">
    <div class="game-icon">⚔️</div>
    <div class="game-name">Mobile Legends</div>
  </div>

  <div class="game" onclick="game('Brawl Stars')">
    <div class="game-icon">⭐</div>
    <div class="game-name">Brawl Stars</div>
  </div>

  <div class="game" onclick="game('Standoff 2')">
    <div class="game-icon">🎮</div>
    <div class="game-name">Standoff 2</div>
  </div>

  <div class="game" onclick="game('Clash of Clans')">
    <div class="game-icon">🏰</div>
    <div class="game-name">Clash of Clans</div>
  </div>

</div>

<div class="bottom">

  <button class="selected" onclick="home()">
    🏠<br>Bosh sahifa
  </button>

  <button onclick="orders()">
    🎮<br>Buyurtma
  </button>

  <button onclick="topUp()">
    💳<br>To‘ldirish
  </button>

  <button onclick="orders()">
    🕐<br>Buyurtmalar
  </button>

  <button onclick="support()">
    👤<br>Profil
  </button>

</div>

<script>
function topUp() {
  const summa = prompt("💰 Balansni to'ldirish\n\nSummani kiriting (so'm):");

  if (summa && Number(summa) > 0) {
    const usul = prompt("To'lov usulini tanlang:\n\n1 — Click\n2 — Payme");

    if (usul === "1") {
      alert("💳 Click tanlandi.\nSumma: " + summa + " so'm");
    } else if (usul === "2") {
      alert("💳 Payme tanlandi.\nSumma: " + summa + " so'm");
    } else {
      alert("❌ To'lov usuli tanlanmadi.");
    }
  } else {
    alert("❌ To'g'ri summa kiriting.");
  }
}

function orders() {
  const orders = JSON.parse(localStorage.getItem("orders") || "[]");

  if (orders.length === 0) {
    alert("📋 Buyurtmalar\n\n❌ Hozircha buyurtmalar mavjud emas.");
    return;
  }

  let text = "📋 BUYURTMALAR\n\n";

  orders.forEach((order, index) => {
    text += `🛒 Buyurtma #${index + 1}\n`;
    text += `🎮 ${order.game || "Noma'lum"}\n`;
    text += `📌 Holati: ${order.status || "Tekshirilmoqda"}\n\n`;
  });

  alert(text);
}

function support() {
  alert("💬 YORDAM BO‘LIMI\n\n📞 Admin: @zefrix_admiral\n\n❓ Muammo bo‘lsa, admin bilan bog‘laning.");
}

function home() {
  window.scrollTo({top: 0, behavior: "smooth"});
}

function game(name) {
  if (name === "PUBG Mobile") {
    const packages = [
      { uc: 60, price: null },
      { uc: 325, price: null },
      { uc: 660, price: null },
      { uc: 1800, price: null }
    ];

    let text = "🪙 PUBG MOBILE UC\n\n";
    packages.forEach((p, i) => {
      text += (i + 1) + ". " + p.uc + " UC";
      text += p.price ? " — " + p.price + " so'm" : " — Narx API orqali olinadi";
      text += "\n";
    });

    const choice = prompt(
      text +
      "\nPaket raqamini tanlang (1-4):"
    );

    const index = Number(choice) - 1;

    if (index < 0 || index >= packages.length) {
      alert("❌ Noto'g'ri paket tanlandi.");
      return;
    }

    const selected = packages[index];

    const playerId = prompt(
      "🎮 PUBG Mobile\n\n" +
      "🪙 " + selected.uc + " UC\n\n" +
      "👤 Player ID raqamingizni kiriting:"
    );

    if (!playerId) {
      alert("❌ Player ID kiritilmadi.");
      return;
    }

    alert(
      "✅ Paket tanlandi!\n\n" +
      "🪙 " + selected.uc + " UC\n" +
      "👤 ID: " + playerId + "\n\n" +
      "💰 Narx keyin API orqali olinadi."
    );

    return;
  }

  alert("🎮 " + name + " tanlandi.");
    }
</script>

</body>
